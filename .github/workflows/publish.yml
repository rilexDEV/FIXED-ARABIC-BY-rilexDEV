name: Publish to PowerShell Gallery

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify API Key Secret
        shell: pwsh
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
            Write-Error "❌ The secret PSGALLERY_API_KEY is not set or is empty!"
            exit 1
          }
          Write-Host "✅ API Key secret is present."
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}

      - name: Enforce TLS 1.2
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Write-Host "✅ TLS 1.2 enforced."

      - name: Validate Module Manifest
        shell: pwsh
        run: |
          $manifestPath = ".\FIXED-ARABIC-BY-rilexDEV.psd1"
          if (-not (Test-Path $manifestPath)) {
            Write-Error "❌ Manifest file not found at $manifestPath"
            exit 1
          }
          try {
            Test-ModuleManifest -Path $manifestPath -ErrorAction Stop
            Write-Host "✅ Module manifest is valid."
          } catch {
            Write-Error "❌ Module manifest validation failed: $_"
            exit 1
          }

      - name: Publish Module to PowerShell Gallery
        shell: pwsh
        run: |
          Publish-Module -Path . -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
