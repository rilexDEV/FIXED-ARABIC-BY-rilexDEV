name: Publish to PowerShell Gallery

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Publish Module
        shell: pwsh
        run: |
          Publish-Module -Path . -NuGetApiKey ${{ secrets.PSGALLERY_API_KEY }}
